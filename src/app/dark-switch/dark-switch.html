<label class="toggle-switch" aria-label="Cambiar tema de la aplicación">
  <input
    type="checkbox"
    [checked]="isDarkMode"
    (change)="toggleDarkMode($event)"
    aria-label="Activar modo oscuro"
    aria-describedby="theme-status"
  />
  <span class="slider" aria-hidden="true"></span>
  <span class="label" id="theme-status">{{ isDarkMode ? '🌙 Dark' : '☀️ Light' }}</span>
</label>
